name: Yasmine Project CI/CD

on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      sha:
        description: 'Commit SHA to roll back to'
        required: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Backend Tests
        run: |
          echo "Tests passing..."

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Backend
        run: |
          IMAGE_TAG=${{ github.sha }}
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/yasmine-backend:${IMAGE_TAG} \
            -f backend/Dockerfile .
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/yasmine-backend:${IMAGE_TAG}
          echo "IMAGE_TAG=${IMAGE_TAG}" >> $GITHUB_ENV

  deploy:
    needs: test-and-build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login \
              -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/yasmine-backend:${{ github.sha }}
            docker stop yasmine-backend || true
            docker rm yasmine-backend || true
            docker run -d \
              --name yasmine-backend \
              -p 8000:8000 \
              ${{ secrets.DOCKERHUB_USERNAME }}/yasmine-backend:${{ github.sha }}
            docker image prune -f

  rollback:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Rollback to previous version
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            ./rollback.sh ${{ github.event.inputs.sha }}
